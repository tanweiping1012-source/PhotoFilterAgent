# 冻结件守卫 —— 只守预登记产物与纯 Python 逻辑。
#
# ⚠️ 这条 CI **不守打分逻辑**。看到绿勾不等于「全测过了」：
#     守得住   select_spread 的段配额/同组上限、stage3 的对决构造、
#              擂台赛与回放裁判、冻结的对局表与交付名单还对不对得上
#     守不住   CLIP 特征、topiq/laion 打分、Apple Vision 的人脸事实
#              —— 那些要 4GB 模型权重和标注者的私人照片，进不了 CI
#
# 冻结件测试自己带一条「不许用 skip 绕过」的断言（test_frozen_baseline.py:92），
# 所以它不会因为文件缺失而静默跳过。其余测试里仍有几处 pytest.skip，
# 下面用 -rs 把跳过原因打出来，别让它们无声无息。
name: frozen

on: [push, pull_request]

jobs:
  frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 显式装最小依赖，**不装 requirements.txt** ——
      # 那里有未 pin commit 的 git+CLIP 依赖，会让 CI 变慢且不可复现。
      #
      # 为什么是三个而不是两个：`photofilter_rank/__init__.py` 会 eager import
      # `rank` → `scan` → `PIL`，所以只装 numpy+pytest 会在 import 阶段就炸。
      # （实测：只装 numpy+pytest → ModuleNotFoundError: No module named 'PIL'）
      - run: pip install numpy Pillow pytest

      # ubuntu-latest 默认没有中文字体。label_image 找不到中文字体就抛错（对的设计：
      # 默认字体会把中文画成方块，比不标更糟），于是全套会红 5 条 —— 从加入全套那一步起就红着。
      # 这不只是 CI 的问题：烧码是阶段 2/3 生产路径要用的，Linux 机器上一样会失败。
      - name: 装中文字体
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      # 实际装上的路径以这里为准。label_image.py 的 Linux 候选取自 Ubuntu 包文件清单，
      # 两边对不上就改代码，不要改这一步去迁就代码。顺带打印最后选中的是哪个字体。
      - name: 中文字体实际路径（label_image 候选的依据）
        working-directory: ranker
        run: |
          fc-list :lang=zh file
          python -c "from photofilter_rank.label_image import load_cjk_font; f = load_cjk_font(20); print('选中：', f.path, f.getname())"

      # 主目标：冻结件。这一步红了就说明预登记产物与代码对不上了。
      - name: 冻结件
        run: pytest ranker/tests/test_frozen_baseline.py -q -rs

      # 全套。原本按「全套要 4GB 依赖」排除掉，实测不成立 ——
      # torch/clip/pyiqa 都是函数内延迟 import，全套 207 条在上面这三个依赖下
      # 十几秒跑完。留着是因为它免费；要退回只守冻结件，删掉这一步即可。
      #
      # 顺带把 **skip 数断言成 0**。理由是这个项目自己的教训：
      # 静默 skip 的守卫等于没有守卫，而且它让测试数看起来更大。
      # 现存的两处 pytest.skip（test_instrument_scoring.py:23 /
      # test_user_facing_claims.py:56,59）都只在**仓库内文件缺失**时触发 ——
      # 真发生了就该红，不该悄悄放过。所以上限是 0，不是「别涨」。
      - name: 全套 + skip 必须为 0
        shell: bash
        run: |
          set -o pipefail
          pytest ranker/tests -q -rs 2>&1 | tee pytest.log
          n=$(grep -c '^SKIPPED' pytest.log || true)
          echo "skip 数 = $n（上限 0）"
          if [ "$n" -gt 0 ]; then
            echo "::error::有测试被跳过 —— 静默 skip 的守卫等于没有守卫。原因见上面的 SKIPPED 行。"
            exit 1
          fi

  # ── TypeScript 类型检查 ──────────────────────────────────────
  #
  # 为什么单独立一个 job：agent-v4 是**产品代码**，每一次付费调用都从它发出去，
  # 而在这之前它**从来没有被真正类型检查过**。
  #
  # 2026-09-14 查明：本仓库原先没有 tsconfig.json，`npx tsc --noEmit` 会向上
  # 解析到 `~/deepseek-harness/tsconfig.json`（harness monorepo 自己的配置，
  # 不覆盖 agent-v4）。于是它报「零错误」，而真实含义是**检查了零个文件** ——
  # 在 anchors.ts 里插一个 `const x: number = "nope"`，它照样报 0 条。
  # 线索是 TS5112（显式指定文件时才会看见）。
  #
  # 第一次真检查就抓到两个**运行时真 bug**（见 agent-v4/tsconfig.json 的注释）。
  #
  # ⚠️ 这一步现在是**红的**，12 条，全在 index.ts。这是刻意的：
  # owner 要先拿到清单再决定哪些必须修、哪些挂起。
  # **不要用 continue-on-error 把它变绿** —— 那就又造了一个看起来在跑的假守卫。
  # 要让 main 绿，只有两条诚实的路：修掉它们，或把 include 暂时缩到已干净的文件。
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 三个 @deepseek-ai 包在 npm 上是公开的（实测 cordis 4.0.2 /
      # dsh-tools 0.0.1-rc.1 / schemastery 3.18.2）。不装它们的话
      # index.ts 会多出 3 条 TS2307 和 33 条连带的 TS7006，
      # 把真正的问题淹掉 —— 那比不检查更糟。
      #
      # 不写 package-lock：本仓库没有锁文件，`--no-save` 保持工作区干净。
      # typescript 钉版本，避免哪天升级换了诊断又说不清是谁变了。
      - name: 装类型检查依赖
        working-directory: agent-v4
        run: |
          npm install --no-save --no-package-lock \
            typescript@5.9 @types/node \
            @deepseek-ai/cordis @deepseek-ai/dsh-tools @deepseek-ai/schemastery

      - name: tsc --noEmit
        working-directory: agent-v4
        run: npx tsc --noEmit

      # 类型检查不跑代码。这两个测试跑真逻辑，几毫秒，顺手带上。
      - name: TS 行为测试
        working-directory: agent-v4
        run: |
          node --experimental-strip-types src/codes.test.ts
          node --experimental-strip-types src/anchors.test.ts
          # ranker.ts 的 RankerError 用了参数属性（readonly detail），strip-only 模式拒绝加载
          # （ERR_UNSUPPORTED_TYPESCRIPT_SYNTAX），所以只有这一个文件要用 transform-types。
          node --experimental-transform-types src/ranker.test.ts
          node --experimental-strip-types src/pairEval.test.ts
          node --experimental-strip-types src/stage3.test.ts
