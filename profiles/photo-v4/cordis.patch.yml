# 照片筛选 v4 profile。
#
# 与 v3（photo-web）的根本差别：这个 profile 里**没有任何视觉模型调用**。
# 排序是本机的确定性函数，模型只负责听懂意图、选参数、解释结果。
# 所以 v3 那一整套让噪声可信的机制（双向盲比、独立盲审、账本、熔断）在这里都不需要。
#
# 隔离：本 profile 只存在于 $DSH_HOME=~/.dsh-v4，不碰 ~/.dsh 里 Codex 的 v3。

- insert:
    - id: photo-filter-v4
      name: '@photo-filter-agent/dsh-photo-filter-v4'
      config:
        rankerDir: @@REPO@@/ranker
        python: @@DSH_HOME@@/ranker-venv/bin/python
        workdir: @@DSH_HOME@@/photo-filter-v4
        cacheDir: @@CACHE@@
        allowedRoots: ["@@PHOTOS@@"]
        # 人工答案子目录必须在**枚举之前**排除。排除晚一步，整轮重合率就作废。
        excludedRelativePaths:
          - "me-pick"
          - "20260221开拓小屋线+防潮坝/me/me-pick"
          - "20260221开拓小屋线+防潮坝/景色pick"
        # 闭眼资格门用的本地引擎（免费、不联网）。不配的话资格门不生效：
        # 实测 20 张名单里会有 6 张闭眼，而用户自己的精选里闭眼 0 张。
        engineBinary: @@REPO@@/engine/.build/release/photofilter
        allowedExportRoots: ["@@EXPORT@@"]
        # 首次跑要建 1024px 缓存 + 算 embedding + 两个质量模型，309 张约 5 分钟。
        rankerTimeoutMs: 1800000
        defaultTarget: 20
        # 锚点范例：这个人自己挑照片的几组例子，连图带原话放进提示词。
        anchorsFile: @@DSH_HOME@@/anchors.json
        # 阶段 2 的组内比较默认用视觉模型。
        # ⚠️ 这一档实测 AB/BA 一致率 45%，通过线 60% —— 没过。
        #    2026-09-03 的仪器标定进一步查明：主因是**同一问题重复问答案就会变**
        #    （输入逐字节相同的重复调用有 62.8% 改口），不是位置偏好、也不是没读到图。
        #    默认开启是产品决定，agent 必须在报告里如实说明。
        stage2Vlm: true
        # 允许「两张都不值得留」。开了它，一个连拍组才可能**整组交不出照片** ——
        # 标注者 75 组判断里有 26 组（35%）正是这一档，而三选一的答案空间
        # 根本没有这个格子，模型即使想说也只能塞进 TIE。
        #
        # ⚠️ 淘汰门槛是**这一组每一局都答 neither**，不是有一局就算。
        #    单局一次就能带走整组，而实测同一调用重复问有 62.8% 改口 ——
        #    那等于把整组命运交给噪声最大的环节。全体一致意味着
        #    (n-1) 局 × 2 个方向的回答全是 neither。
        #
        # 生产开、评测不开：评测那条路要与 R2/R3 可比，答案空间不能变。
        allowNeither: true

# 图片张数有**两道**上限，它们不是同一个：
#   ① agent-v4/src/harness-vision.ts  MAX_JPEGS_PER_CALL = 40   （插件侧，我们的）
#   ② attachment-local                maxImagesPerMessage = 20  （harness 侧，默认值）
#
# 只抬 ① 会在 ② 上撞死，而且**失败形态是静默回落**：
# 2026-09-04 冒烟实测，生产阶段 2 一次要发 24 幅（10 张锚点 × 2 + 考题 2 张 × 2），
# 24 > 20 被 ② 拦下，报「匿名 JPEG 超出 Harness attachment 限制」，
# 然后整条 VLM 复核**悄悄退回本地分排序** —— 跑完一切正常，只是一次模型都没调。
#
# 这个坑以前只在 photo-v4-ab 上修过。加锚点之后所有带 stage2Vlm 的 profile
# 都会撞上，而没人真跑过生产链路，所以一直没暴露。
#
# 抬 ② 而不是削锚点：削成只发人脸特写能过 20，但那就改掉了
# 「每张范例占两幅：整幅 + 人脸特写，和考题一样的排法」—— 等于偷偷换掉被测的处理。
- id: attachment-local
  config:
    maxImagesPerMessage: 40

# 关掉全部通用文件系统与 shell 能力。
#
# v4 的排序链路本身一张照片都不外发，但通用工具会绕过这个结构：
# read_image 把**原图**（全分辨率、带 EXIF 与 GPS）直接读进对话，
# glob/grep 泄露真实文件名。v3 实测模型确实尝试过这两条路。
- id: tool-bash
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
# 它能改写磁盘上的文件——"原图只读"不能靠 agent 自觉遵守。
- id: tool-str-replace-editor
  disabled: true
- id: tool-web
  disabled: true
