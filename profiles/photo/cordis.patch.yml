# 照片策展 profile 的补丁层。
#
# 分工：harness 提供循环、会话、工具管线与模型接入；photo-filter-agent 插件提供领域能力
# （本地分析引擎、视觉打分、连拍比较、提议校验、导出）。
#
# 主循环、领域视觉评分与独立 evaluator 统一继承用户当前 Harness 会话路由。
# 领域工具只发匿名缩略 JPEG 的隔离 one-shot，不把图片写入主对话历史。
# 旧 profile 不得覆盖用户的 agent-default-model，也不得指定独立视觉模型。

- insert:
    - id: photo-filter-agent
      name: '@photo-filter-agent/dsh-photo-filter-agent'
      config:
        engineBinary: @@PHOTO_FILTER_HOME@@/engine/.build/release/photofilter
        workdir: @@DSH_HOME@@/photo-filter-agent
        maxInspectBatch: 8
        # 并发路数：开满会换来 429 再触发退避，反而更慢。
        inspectConcurrency: 4
        maxInlineIdList: 80
        defaultPeopleTarget: 6
        defaultSceneryTarget: 6
        excludedRelativePaths: []

# 关掉全部通用文件系统与 shell 能力。
#
# 这个 agent 只该做一件事：只读地看照片、复制出选中的那些。而 read_image 会把
# **原图**（全分辨率、带 EXIF 与 GPS）直接读进对话，绕过引擎的匿名化、降采样和
# 元数据剥离；glob/grep 则会泄露真实文件名。实测模型确实尝试过 read_image 与 glob。
#
# 需要的能力 photo-filter-agent 都提供了：analyze_folder 看目录、preview 出无元数据缩略图、
# export_selection 只复制。
- id: tool-bash
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: skill-filesystem
  disabled: true
# 它能改写磁盘上的文件——"原图只读"这条承诺不能靠 agent 自觉遵守。
- id: tool-str-replace-editor
  disabled: true
# 这个 agent 不需要联网搜索；少一条对外通路就少一条照片信息外泄的可能。
- id: tool-web
  disabled: true
